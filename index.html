    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.90);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0f766e;
            --accent: #c88b32;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000000;
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: filter 1s ease;
        }

        body.blurring {
            filter: blur(12px);
        }

        /* CAPA CRT SCANLINES (Recuerdos radioactivos frente al televisor) */
        .crt-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2000;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.65;
        }

        /* Capa de fondo estática, nítida y completa (Misión) */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(11, 19, 41, 0.01), rgba(11, 19, 41, 0.01)), url('Quimera_Mision.webp');
            background-size: cover;
            background-position: center center;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .bg-image.visible {
            opacity: 1;
        }

        /* Capa de luz reactiva exclusiva del puntero */
        .cursor-light-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle 400px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.22), rgba(200, 139, 50, 0.12) 45%, transparent 80%);
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .cursor-light-glow.visible {
            opacity: 1;
        }

        /* Canvas para Lluvia de Código Matrix limpia y fluida */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        /* Capa de Glitch Central para las 7 Letras */
        #glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            pointer-events: none;
            opacity: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            transition: opacity 0.1s ease;
        }

        #glitch-img {
            max-width: 55vw;
            max-height: 55vh;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(56, 189, 248, 1)) contrast(160%) brightness(1.3);
            animation: glitchJitter 0.08s infinite steps(2);
        }

        @keyframes glitchJitter {
            0% { transform: translate(0, 0) skew(0deg); filter: hue-rotate(0deg); }
            20% { transform: translate(-6px, 4px) skew(-3deg); filter: hue-rotate(90deg); }
            40% { transform: translate(6px, -4px) skew(3deg); filter: hue-rotate(-90deg); }
            60% { transform: translate(-3px, -4px) skew(1deg); }
            80% { transform: translate(5px, 3px) skew(-2deg); }
            100% { transform: translate(0, 0) skew(0deg); }
        }

        .fade-out-element {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 1.2s ease !important;
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
        }

        .top-bar {
            background-color: rgba(11, 19, 41, 0.0);
            padding: 0.85rem 2rem;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            opacity: 0;
            transition: opacity 500ms ease;
        }

        .top-bar-container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.01em;
            display: inline-block;
            transition: color 0.2s ease, opacity 500ms ease;
        }

        .brand-logo:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            gap: clamp(0.5rem, 2vw, 1.25rem);
            list-style: none;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        #audio-toggle, #fullscreen-toggle {
            display: inline-block;
            background: rgba(56, 189, 248, 0.22);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #ffffff;
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
            transition: opacity 500ms ease, background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #audio-toggle:hover, #fullscreen-toggle:hover {
            background: rgba(56, 189, 248, 0.5);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            color: #ffffff;
        }

        /* EFECTO LÁSER COMÚN (ACELERADO A 0.6s) */
        .laser-burn-effect {
            opacity: 0;
            clip-path: inset(0 100% 0 0);
            position: relative;
        }

        .laser-burn-effect.active-laser {
            opacity: 1;
            animation: hyperLaserReveal 0.6s cubic-bezier(0.15, 1, 0.2, 1) forwards;
        }

        .laser-burn-effect.revealed {
            opacity: 1;
            clip-path: inset(0 0 0 0);
        }

        .laser-burn-effect.active-laser::before {
            content: '';
            position: absolute;
            top: -30px;
            bottom: -30px;
            left: 0;
            width: 16px;
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #c88b32 80%, transparent 100%);
            box-shadow: 0 0 35px #38bdf8, 0 0 70px #fffbeb, 0 0 100px #c88b32, inset 0 0 15px #ffffff;
            animation: hyperLaserBarMove 0.6s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 15;
            filter: blur(0.5px);
        }

        .laser-burn-effect.active-laser::after {
            content: '';
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 120%;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(56,189,248,0.6) 30%, rgba(200,139,50,0.3) 60%, transparent 100%);
            mix-blend-mode: color-dodge;
            animation: hyperLaserSparksWave 0.6s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 12;
        }

        @keyframes hyperLaserReveal {
            0% {
                clip-path: inset(0 100% 0 0);
                filter: brightness(4) contrast(200%) drop-shadow(0 0 30px rgba(56, 189, 248, 1));
            }
            50% {
                filter: brightness(2.5) contrast(150%) drop-shadow(0 0 15px rgba(200, 139, 50, 0.9));
            }
            100% {
                clip-path: inset(0 0 0 0);
                filter: brightness(1) contrast(100%) drop-shadow(0 0 0px transparent);
            }
        }

        @keyframes hyperLaserBarMove {
            0% { left: 0%; opacity: 1; transform: scaleY(1.8) skewX(-15deg); }
            50% { transform: scaleY(2.2) skewX(5deg); }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; transform: scaleY(0.5) skewX(0deg); }
        }

        @keyframes hyperLaserSparksWave {
            0% { opacity: 1; clip-path: inset(0 100% 0 0); }
            100% { opacity: 0; clip-path: inset(0 0 0 0); }
        }

        .hologram-mode {
            animation: hologramNeonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes hologramNeonGlow {
            0% { text-shadow: 0 0 8px rgba(56, 189, 248, 0.7), 0 0 20px rgba(15, 118, 110, 0.5), 3px 3px 8px rgba(0, 0, 0, 0.8); }
            50% { text-shadow: 0 0 20px rgba(56, 189, 248, 1), 0 0 35px rgba(56, 189, 248, 0.8), 0 0 50px rgba(200, 139, 50, 0.6), 3px 3px 8px rgba(0, 0, 0, 0.8); }
            100% { text-shadow: 0 0 8px rgba(56, 189, 248, 0.7), 0 0 20px rgba(15, 118, 110, 0.5), 3px 3px 8px rgba(0, 0, 0, 0.8); }
        }

        @keyframes hologramBoxGlow {
            0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), 0 0 30px rgba(15, 118, 110, 0.3), 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
            50% { box-shadow: 0 0 32px rgba(56, 189, 248, 0.95), 0 0 65px rgba(56, 189, 248, 0.65), 0 0 85px rgba(200, 139, 50, 0.55), 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
            100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), 0 0 30px rgba(15, 118, 110, 0.3), 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        }

        .page-title {
            position: absolute;
            top: 12vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.0rem, 09vw, 5rem);
            font-weight: 700;
            letter-spacing: 0em;
            text-transform: uppercase;
            color: #e2a547;
            display: inline-block;
            line-height: 1.1;
            -webkit-text-stroke: 1.5px #ffffff;
            white-space: nowrap;
            z-index: 10;
        }

        .quimera-word-container {
            position: absolute;
            top: 61vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.5rem, 10vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.25em;
            line-height: 1.1;
            -webkit-text-stroke: 1.5px #000000;
            cursor: default;
            white-space: nowrap;
            z-index: 10;
        }

        .quimera-letter {
            display: inline-block;
            color: #ffffff;
            transition: color 0.4s ease;
        }

        .subtitle-text {
            position: absolute;
            top: calc(61vh + 5.5rem + 1.0rem);
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(1rem, 2vw, 1.3rem);
            font-weight: 700;
            line-height: 1.5;
            max-width: 900px;
            width: 90%;
            color: #ffffff;
            text-align: center;
            z-index: 10;
            -webkit-text-stroke: 0.75px #000000;
        }

        .exploration-box {
            position: absolute;
            top: 92.5vh;
            left: 50%;
            transform: translateX(-50%);
            max-width: 1125px;
            width: 100%;
            padding: 0.3rem 0.8rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: clamp(0.8rem, 1.5vw, 0.9rem);
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            z-index: 10;
            -webkit-text-stroke: 0.4px #000000;
        }

        footer.laser-burn-effect {
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            padding: 0.5rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: #ffffff;
            font-size: clamp(0.7rem, 1.2vw, 0.85rem);
            z-index: 100;
        }

        footer p {
            color: #e2e8f0;
        }

        @media (max-width: 900px) {
            body { height: auto; overflow-y: auto; overflow-x: hidden; }
            .bg-image { height: 100%; background-attachment: scroll; }
            .top-bar { position: relative !important; flex-direction: column; gap: 0.5rem; padding: 1rem; text-align: center; }
            .top-bar-container { flex-direction: column; gap: 0.8rem; }
            .nav-links { justify-content: center; gap: 0.8rem; }
            .page-title, .quimera-word-container, .subtitle-text, .exploration-box {
                position: relative !important; top: auto !important; left: auto !important; transform: none !important; width: 100% !important; max-width: 100% !important; margin: 1rem auto !important; text-align: center; white-space: normal !important;
            }
            .subtitle-text { padding: 0 1rem; }
            .exploration-box { padding: 1rem !important; }
            footer.laser-burn-effect { position: relative !important; margin-top: 1.5rem; padding: 1rem; bottom: auto !important; left: auto !important; }
        }

        /* MODAL PRINCIPAL CON IMAGEN DE FONDO QUIMERA_M_MOD.WEBP */
        #modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('Quimera_M_Mod.webp');
            background-size: cover;
            background-position: center center;
            border: 1px solid var(--card-border);
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 750px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-lg);
            text-align: left;
            transform-origin: center center;
        }

        /* Submodal para Imágenes intermedias con efectos de TV y Scanlines */
        #submodal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #submodal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .submodal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem 1.5rem 1.5rem 1.5rem;
            max-width: 85vw;
            max-height: 85vh;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
        }

        /* Capa de líneas de barrido CRT para los submodales */
        .submodal-scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.75;
            border-radius: 12px;
        }

        .submodal-box img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
            object-fit: contain;
            display: block;
            position: relative;
            z-index: 2;
        }

        .submodal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #c88b32;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s ease;
            z-index: 2010;
            line-height: 1;
        }

        .submodal-close:hover {
            color: #ffffff;
        }

        .modal-link {
            color: #c88b32;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .modal-link:hover {
            color: #ffffff;
        }

        @keyframes tvShutdown {
            0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
            40% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            70% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
        }

        @keyframes tvTurnOn {
            0% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
            30% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            60% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            100% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
        }

        .modal-box.crt-entry, .submodal-box.crt-entry {
            animation: tvTurnOn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards, hologramBoxGlow 3s ease-in-out infinite alternate;
            animation-delay: 0s, 0.4s;
        }

        .modal-box.crt-exit, .submodal-box.crt-exit {
            animation: tvShutdown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-box h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 700;
            color: #c88b32;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            -webkit-text-stroke: 0.25px #ffffff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
        }

        .modal-box p, .modal-box li {
            font-size: clamp(0.9rem, 2vw, 1.02rem);
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 1rem;
            line-height: 1.8;
            -webkit-text-stroke: 0.3px #000000;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
        }

        #modal-body.centered-text p {
            text-align: center;
        }

        .modal-box ul { padding-left: 1.25rem; margin-bottom: 1rem; }

        .process-flow {
            background: rgba(15, 118, 110, 0.25);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.5vw, 0.9rem);
            text-align: center;
            margin: 1rem 0;
            color: #5eead4;
        }

        .close-link {
            display: inline-block;
            color: #c88b32;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .close-link:hover { color: #e0a96d; }
    </style>
</head>
<body>

    <!-- Capa CRT Scanlines -->
    <div class="crt-scanlines"></div>

    <!-- Elemento de Audio -->
    <audio id="bg-music" src="Quimera_Milonga_(Lado_B).mp3" loop preload="auto" crossorigin="anonymous"></audio>

    <!-- Capa de fondo estática para Misión -->
    <div class="bg-image" id="bg-image"></div>
    
    <!-- Capa de luz reactiva exclusiva del puntero -->
    <div class="cursor-light-glow" id="cursor-light-glow"></div>

    <!-- Canvas para la Lluvia Matrix -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Capa de Glitch Central -->
    <div id="glitch-overlay">
        <img id="glitch-img" src="" alt="Glitch Visual">
    </div>

    <!-- Capa de desvanecimiento inicial en blanco -->
    <div id="intro-overlay"></div>

    <!-- Navegación Top Bar -->
    <nav class="top-bar">
        <div class="top-bar-container">
            <a href="https://quimerac3.github.io/" class="brand-logo laser-burn-effect" id="brand-logo" data-text="QUIMERA - Inicio General"></a>
            <ul class="nav-links">
                <li><a href="#" id="audio-toggle" class="laser-burn-effect"><span style="color: #ffffff;">🎵</span> Música: OFF</a></li>
                <li><a href="#" id="fullscreen-toggle" class="laser-burn-effect">⛶ Pantalla Completa</a></li>
            </ul>
        </div>

        function playQuimeraAppearanceAsync() {
            return new Promise(resolve => {
                let idx = 0;
                function showNextRed() {
                    if (idx < letters.length) {
                        letters[idx].style.color = '#c88b32';
                        idx++;
                        setTimeout(showNextRed, 200);
                    } else {
                        setTimeout(showWhiteLetters, 250);
                    }
                }
                function showWhiteLetters() {
                    let jdx = 0;
                    function showNextWhite() {
                        if (jdx < letters.length) {
                            letters[jdx].style.color = '#ffffff';
                            jdx++;
                            setTimeout(showNextWhite, 150);
                        } else {
                            activateCurrentLetter();
                            resolve();
                        }
                    }
                    showNextWhite();
                }
                showNextRed();
            });
        }

        function activateCurrentLetter() {
            if (currentLetterIndex >= letters.length) return;
            const targetLetter = letters[currentLetterIndex];
            let isWhite = true;

            activeBlinkInterval = setInterval(() => {
                targetLetter.style.color = isWhite ? '#c88b32' : '#ffffff';
                isWhite = !isWhite;
            }, 250);

            targetLetter.style.cursor = 'pointer';
            targetLetter.onclick = () => handleLetterClick(currentLetterIndex);
        }

        function handleLetterClick(index) {
            const targetLetter = letters[index];
            targetLetter.onclick = null;
            clearInterval(activeBlinkInterval);

            let blinks = 0;
            let isWhite = false;
            const blinkFive = setInterval(() => {
                targetLetter.style.color = isWhite ? '#ffffff' : '#c88b32';
                isWhite = !isWhite;
                blinks++;
                if (blinks >= 10) {
                    clearInterval(blinkFive);
                    targetLetter.style.color = '#ffffff';

                    if (index === 6) {
                        setTimeout(() => {
                            triggerMatrixAndFadeElements();
                        }, 2800);
                    }

                    triggerLetterGlitch(index, () => {
                        showModalTyped(index);
                    });
                }
            }, 100);
        }

            const glitchOverlay = document.getElementById('glitch-overlay');

        function triggerMatrixAndFadeElements() {
            const bgImg = document.getElementById('bg-image');
            if (bgImg) bgImg.classList.remove('visible');

            const cursorGlow = document.getElementById('cursor-light-glow');
            if (cursorGlow) cursorGlow.classList.remove('visible');

            const elementsToFade = [
                document.getElementById('brand-logo'),
                document.getElementById('audio-toggle'),
                document.getElementById('fullscreen-toggle'),
                document.getElementById('main-title'),
                document.getElementById('sub-text'),
                document.getElementById('exp-box'),

            elementsToFade.forEach(el => {
                if (el) el.classList.add('fade-out-element');
            });

            const quimeraWord = document.getElementById('quimera-word');
            if (quimeraWord) {
                quimeraWord.classList.remove('hologram-mode');
                quimeraWord.style.opacity = '1';
                quimeraWord.style.textShadow = '3px 3px 8px rgba(0, 0, 0, 0.9)';
            }

            startMatrixRainClean();
            const canvas = document.getElementById('matrix-canvas');
            if (canvas) canvas.style.opacity = '1';
        }

        let matrixInterval = null;
        function startMatrixRainClean() {
            const canvas = document.getElementById('matrix-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZカタカナアアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const fontSize = 16;
            let columns = Math.floor(canvas.width / fontSize);
            let drops = Array(columns).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    ctx.fillStyle = Math.random() > 0.85 ? '#fffbeb' : '#c88b32';
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            if (matrixInterval) clearInterval(matrixInterval);
            matrixInterval = setInterval(draw, 30);
        }

        async function showModalTyped(index) {
            const backdrop = document.getElementById('modal-backdrop');
            const modalBox = document.getElementById('modal-content-box');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalBox.classList.remove('crt-exit');
            modalBox.classList.add('crt-entry');
            
            modalTitle.innerHTML = "";
            modalBody.innerHTML = "";
            
            backdrop.classList.add('active');

            const data = modalData[index];
            if (data.centered) {
                modalBody.classList.add('centered-text');
            } else {
                modalBody.classList.remove('centered-text');
            }

            modalTitle.textContent = data.title;
            modalTitle.className = 'laser-burn-effect';

            const createdElements = [modalTitle];

            for (let item of data.content) {
                if (item.type === 'p') {
                    let pElem = document.createElement('p');
                    pElem.className = 'laser-burn-effect';
                    pElem.innerHTML = item.text;
                    modalBody.appendChild(pElem);
                    createdElements.push(pElem);
                } else if (item.type === 'flow') {
                    let flowElem = document.createElement('div');
                    flowElem.className = 'process-flow laser-burn-effect';
                    flowElem.textContent = item.text;
                    modalBody.appendChild(flowElem);
                    createdElements.push(flowElem);
                } else if (item.type === 'ul') {
                    let ulElem = document.createElement('ul');
                    modalBody.appendChild(ulElem);
                    for (let liText of item.items) {
                        let liElem = document.createElement('li');
                        liElem.className = 'laser-burn-effect';
                        liElem.innerHTML = liText;
                        ulElem.appendChild(liElem);
                        createdElements.push(liElem);
                    }
                }
            }

            // Escuchadores para abrir submodales de imágenes intermedias
            modalBody.querySelectorAll('.modal-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const imgSrc = link.getAttribute('data-img');
                    openSubmodal(imgSrc);
                });
            });

            let closeContainer = document.createElement('div');
            closeContainer.className = 'laser-burn-effect';
            closeContainer.style.textAlign = 'right';
            closeContainer.style.marginTop = '1.5rem';

            let closeBtn = document.createElement('span');
            closeBtn.className = 'close-link';
            closeBtn.id = 'modal-close-btn';
            closeBtn.textContent = 'Cerrar.';

            closeContainer.appendChild(closeBtn);
            modalBody.appendChild(closeContainer);
            createdElements.push(closeContainer);

            await new Promise(r => setTimeout(r, 200));

            for (let el of createdElements) {
                el.classList.add('active-laser');
                await new Promise(r => setTimeout(r, 250)); // Traslape escalonado rápido de 250ms
            }

            await new Promise(r => setTimeout(r, 600)); // Espera final sincronizada a 600ms

            for (let el of createdElements) {
                el.classList.remove('active-laser');
                el.classList.add('revealed');
            }

            const triggerClose = () => {
                closeBtn.onclick = null;
                backdrop.onclick = null;

                modalBox.classList.remove('crt-entry');
                modalBox.classList.add('crt-exit');
                backdrop.classList.remove('active');

                setTimeout(() => {
                    letters[index].style.color = '#c88b32';
                    currentLetterIndex++;
                    selectedCount++;

                    if (selectedCount < 7) {
                        activateCurrentLetter();
                    } else {
                        enableFinalHyperlink();
                    }
                }, 400);

                setTimeout(() => {
                    modalBox.classList.remove('crt-exit');
                }, 800);
            };

            closeBtn.onclick = triggerClose;
            backdrop.onclick = (e) => {
                if (e.target === backdrop) {
                    triggerClose();
                }
            };
        }

        function enableFinalHyperlink() {
            const wordContainer = document.getElementById('quimera-word');

            wordContainer.style.opacity = '1';
            wordContainer.style.pointerEvents = 'auto';

            const stepTime = 120;

            function runSequence() {
                let i = 0;
                function turnCopperGold(callback) {
                    if (i < letters.length) {
                        letters[i].style.color = '#c88b32';
                        i++;
                        globalColorInterval = setTimeout(() => turnCopperGold(callback), stepTime);
                    } else if (callback) callback();
                }

                let j = 0;
                function turnWhite(callback) {
                    if (j < letters.length) {
                        letters[j].style.color = '#ffffff';
                        j++;
                        globalColorInterval = setTimeout(() => turnWhite(callback), stepTime);
                    } else if (callback) callback();
                }

                turnCopperGold(() => {
                    i = 0;
                    turnWhite(() => {
                        j = 0;
                        globalColorInterval = setTimeout(runSequence, 0);
                    });
                });
            }

            runSequence();

            wordContainer.onclick = () => {
                clearTimeout(globalColorInterval);
                document.body.classList.add('blurring');
                const overlay = document.getElementById('intro-overlay');
                overlay.style.background = '#ffffff';
                overlay.style.opacity = '1';
                overlay.classList.remove('fade-out');

                setTimeout(() => {
                    window.location.href = "https://quimerac3.github.io/QuimeraC3-Q/";
                }, 1000);
            };
        }
    </script>
</body>
</html>
