<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quimera &bull; Ecosistema Científico, Académico y Profesional</title>
    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.90);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0f766e;
            --accent: #c88b32;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000000;
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: filter 1s ease;
        }

        body.blurring {
            filter: blur(12px);
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(11, 19, 41, 0.01), rgba(11, 19, 41, 0.01)), url('Quimera_Mision.png');
            background-size: cover;
            background-position: center center;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .bg-image.visible {
            opacity: 1;
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
        }

        .top-header {
            position: absolute;
            top: 2.5rem;
            left: 3rem;
            z-index: 100;
        }

        .top-header a {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.01em;
            transition: color 0.2s ease;
            opacity: 0;
        }

        .top-header a:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .top-header-right {
            position: absolute;
            top: 2rem;
            right: 3rem;
            z-index: 100;
            display: flex;
            gap: 1rem;
        }

        .top-header-right a {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            opacity: 0;
            transition: opacity 0.8s ease, background-color 0.3s ease;
            background: rgba(15, 118, 110, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 20px;
        }

        .top-header-right a.visible {
            opacity: 1;
        }

        .top-header-right a:hover {
            background: var(--primary);
            color: #ffffff;
        }

        .page-title {
            position: absolute;
            top: 15vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #c88b32;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.85), 0 0 25px rgba(255, 255, 255, 0.5), 0 2px 8px rgba(0, 0, 0, 1.0);
            white-space: nowrap;
            opacity: 0;
            z-index: 10;
        }

        .quimera-word-container {
            position: absolute;
            top: 78vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            cursor: default;
            opacity: 0;
            transition: opacity 0.8s ease;
            white-space: nowrap;
            z-index: 10;
        }

        .quimera-word-container.visible {
            opacity: 1;
        }

        .quimera-letter {
            display: inline-block;
            color: #ffffff;
            transition: color 0.4s ease;
        }

        .subtitle-text {
            position: absolute;
            top: calc(78vh + 5.0rem + 0.5rem);
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.3rem;
            line-height: 1.5;
            max-width: 900px;
            width: 90%;
            color: #e2e8f0;
            text-align: center;
            opacity: 0;
            z-index: 10;
        }

        .exploration-box {
            position: absolute;
            top: 92.5vh;
            left: 50%;
            transform: translateX(-50%);
            max-width: 1100px;
            width: 100%;
            padding: 0.2rem 0.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #cbd5e1;
            opacity: 0;
            transition: opacity 0.8s ease;
            text-align: center;
            z-index: 10;
        }

        .exploration-box.visible {
            opacity: 1;
        }

        #exp-title {
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 0.5rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: #ffffff;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 500ms ease;
            z-index: 100;
        }

        footer.visible {
            opacity: 1;
        }

        footer p {
            color: #e2e8f0;
        }

        @media (min-width: 1400px) and (max-width: 1920px) and (max-height: 1080px) {
            .page-title { top: 15vh; }
            .quimera-word-container { top: 78vh; }
            .subtitle-text { top: calc(78vh + 5.0rem + 0.5rem); }
            .exploration-box { top: 92.5vh; }
        }

        @media (max-width: 900px) {
            body { height: auto; overflow-y: auto; overflow-x: hidden; }
            .bg-image { height: 100%; background-attachment: scroll; }
            .top-header, .top-header-right { position: relative !important; top: auto !important; left: auto !important; right: auto !important; text-align: center; justify-content: center; margin: 1rem 0; }
            .top-header-right { flex-wrap: wrap; gap: 0.8rem; }
            .page-title, .quimera-word-container, .subtitle-text, .exploration-box { position: relative !important; top: auto !important; left: auto !important; transform: none !important; width: 100% !important; max-width: 100% !important; margin: 1rem auto !important; text-align: center; white-space: normal !important; }
            .page-title { font-size: 1.8rem !important; }
            .quimera-word-container { font-size: 2.5rem !important; }
            .subtitle-text { font-size: 1rem !important; padding: 0 1rem; }
            .exploration-box { padding: 1rem !important; }
            footer { position: relative !important; margin-top: 1.5rem; padding: 1rem; }
        }

        /* Recuadro Central Modal Principal */
        #modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 750px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            text-align: left;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            transform-origin: center center;
        }

        @keyframes tvShutdown {
            0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
            40% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            70% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
        }

        .modal-box.crt-exit {
            animation: tvShutdown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes tvStartup {
            0% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
            40% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            70% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            100% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
        }

        /* Submodal para Imágenes con efectos de TV */
        #submodal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #submodal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .submodal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem 1.5rem 1.5rem 1.5rem;
            max-width: 85vw;
            max-height: 85vh;
            box-shadow: var(--shadow-lg);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
        }

        .submodal-box.crt-enter {
            animation: tvStartup 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .submodal-box.crt-exit {
            animation: tvShutdown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .submodal-box img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
            object-fit: contain;
            display: block;
        }

        .submodal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #c88b32;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s ease;
            z-index: 2010;
            line-height: 1;
        }

        .submodal-close:hover {
            color: #ffffff;
        }

        .modal-link {
            color: #5eead4;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .modal-link:hover {
            color: #ffffff;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .modal-box h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.5rem;
            color: #c88b32;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .modal-box p, .modal-box li {
            font-size: 1.02rem;
            color: #f1f5f9;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .modal-box ul {
            padding-left: 1.25rem;
            margin-bottom: 1rem;
        }

        .process-flow {
            background: rgba(15, 118, 110, 0.2);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            margin: 1rem 0;
            color: #5eead4;
        }

        .close-link {
            display: inline-block;
            color: #c88b32;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .close-link:hover {
            color: #e0a96d;
        }
    </style>
</head>

    <script>
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        const music = document.getElementById('bg-music');
        const musicLink = document.getElementById('music-link');
        let isMusicPlaying = false;

        musicLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                musicLink.textContent = '🎵 Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    musicLink.textContent = '🎶 Música: ON';
                    isMusicPlaying = true;
                }).catch(error => {
                    console.log("Error al reproducir audio:", error);
                });
            }
        });

        const fullscreenLink = document.getElementById('fullscreen-link');

        fullscreenLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenLink.textContent = '❌ Salir Pantalla Completa';
                }).catch(err => {
                    console.log("Error al intentar entrar en pantalla completa:", err);
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenLink.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenLink.textContent = '⛶ Pantalla Completa';
            } else {
                fullscreenLink.textContent = '❌ Salir Pantalla Completa';
            }
        });

        const modalData = [
            {
                title: "NUESTRA RAZÓN DE EXISTIR.",
                content: [
                    { type: 'p', text: "Quimera existe porque el conocimiento adquiere verdadero valor cuando puede ser comprendido, conectado, desarrollado, aplicado y transferido." },
                    { type: 'p', text: "Los problemas científicos, médicos, académicos y profesionales rara vez pertenecen a una sola disciplina. Su complejidad exige integrar conocimientos, establecer relaciones, formular mejores preguntas y desarrollar métodos que permitan transformar información en comprensión y comprensión en acción." },

                    { type: 'ul', items: [
                        "<a href='#' class='modal-link' data-img='Quimera_Investigacion.png'>-01. Investigación.</a>",
                        "<a href='#' class='modal-link' data-img='Quimera_Formacion.png'>-02. Formación.</a>",
                        "<a href='#' class='modal-link' data-img='Quimera_Desarrollo.png'>-03. Desarrollo.</a>",
                        "<a href='#' class='modal-link' data-img='Quimera_Aplicacion.png'>-04. Aplicación.</a>",
                        "<a href='#' class='modal-link' data-img='Quimera_Transferencia.png'>-05. Transferencia.</a>"
                    ]}
                ]
            },
            {
                title: "EL CICLO DE QUIMERA.",

                    { type: 'p', text: "Estos procesos no funcionan como etapas asiladas.\nForman un ciclo dinámico, <a href='#' class='modal-link' data-img='Quimera_Ciclo.png'>EL CICLO DE QUIMERA</a>:" },

                    { type: 'p', text: `Cada resultado puede convertirse en el punto de partida de una nueva investigación.

        function typeWriter(elementId, text, speed = 35) {
            return new Promise(resolve => {
                const el = document.getElementById(elementId);
                if (!el) { resolve(); return; }
                el.innerHTML = '';
                el.style.opacity = 1; 
                let i = 0;
                function type() {
                    if (i < text.length) {
                        el.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        function typeWriterHTML(element, htmlString, speed = 20) {
            return new Promise(resolve => {
                if (!element) { resolve(); return; }
                element.innerHTML = '';
                const tokens = htmlString.match(/(<\/?[^>]+(>|$)|[^<]+)/g) || [htmlString];
                let tokenIdx = 0;
                let charIdx = 0;
                
                function type() {
                    if (tokenIdx < tokens.length) {
                        let currentToken = tokens[tokenIdx];
                        if (currentToken.startsWith('<')) {
                            element.innerHTML += currentToken;
                            tokenIdx++;
                            setTimeout(type, speed);
                        } else {
                            if (charIdx < currentToken.length) {
                                element.innerHTML += currentToken.charAt(charIdx);
                                charIdx++;
                                setTimeout(type, speed);
                            } else {
                                charIdx = 0;
                                tokenIdx++;
                                setTimeout(type, speed);
                            }
                        }
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        async function runIntroSequence() {
            const whiteOverlay = document.getElementById('intro-overlay');
            if (whiteOverlay) whiteOverlay.classList.add('fade-out');
            await new Promise(r => setTimeout(r, 1000));

            const bgImage = document.getElementById('bg-image');
            if (bgImage) bgImage.classList.add('visible');
            await new Promise(r => setTimeout(r, 1000));

            await typeWriter('header-link', 'QUIMERA - Inicio General', 40);
            await new Promise(r => setTimeout(r, 400));

            const musicLink = document.getElementById('music-link');
            if (musicLink) musicLink.classList.add('visible');
            await new Promise(r => setTimeout(r, 400));

            const fullscreenLink = document.getElementById('fullscreen-link');
            if (fullscreenLink) fullscreenLink.classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await typeWriter('main-title', 'MISIÓN', 80);
            await new Promise(r => setTimeout(r, 400));

            const quimeraWord = document.getElementById('quimera-word');
            if (quimeraWord) quimeraWord.classList.add('visible');
            await new Promise(r => setTimeout(r, 800));
            await playQuimeraAppearanceAsync();
            await new Promise(r => setTimeout(r, 400));

            await typeWriter('sub-text', 'Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.', 35);
            await new Promise(r => setTimeout(r, 400));

            const expBox = document.getElementById('exp-box');
            if (expBox) expBox.classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await typeWriter('exp-title', 'EXPLORACIÓN INTERACTIVA: Una vez que la palabra QUIMERA cambie de color a blanco, seleccione la letra parpadeante para descubrir: ¿Qué es QUIMERA?', 25);
            await new Promise(r => setTimeout(r, 400));

            const footer = document.querySelector('footer');
            if (footer) footer.classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await new Promise(resolveFooter => {
                const footerPs = document.querySelectorAll('footer p');
                let pIndex = 0;
                function typeFooterP() {
                    if (pIndex >= footerPs.length) {
                        resolveFooter();
                        return;
                    }
                    let p = footerPs[pIndex];
                    let text = p.dataset.text.replace('2026', new Date().getFullYear());
                    let i = 0;
                    function typeChar() {
                        if (i <= text.length) {
                            p.innerHTML = text.substring(0, i);
                            i++;
                            setTimeout(typeChar, 18);
                        } else {
                            pIndex++;
                            setTimeout(typeFooterP, 100);
                        }
                    }
                    typeChar();
                }
                typeFooterP();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runIntroSequence, 400);

            const headerLink = document.getElementById('header-link');
            if (headerLink) {
                headerLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    const overlay = document.getElementById('intro-overlay');
                    if (overlay) {
                        overlay.style.background = '#ffffff';
                        overlay.style.opacity = '1';
                        overlay.classList.remove('fade-out');
                    }
                    setTimeout(() => {
                        window.location.href = "https://quimerac3.github.io/";
                    }, 500);
                });
            }

            // Manejo de eventos del submodal de imágenes
            const subBackdrop = document.getElementById('submodal-backdrop');
            const subCloseBtn = document.getElementById('submodal-close-btn');

            if (subCloseBtn) {
                subCloseBtn.onclick = (e) => {
                    e.preventDefault();
                    closeSubmodal();
                };
            }

            if (subBackdrop) {
                subBackdrop.onclick = (e) => {
                    if (e.target === subBackdrop) {
                        closeSubmodal();
                    }
                };
            }
        });

        const letters = document.querySelectorAll('.quimera-letter');
        let currentLetterIndex = 0;
        let selectedCount = 0;
        let activeBlinkInterval = null;
        let globalColorInterval = null;

        function playQuimeraAppearanceAsync() {
            return new Promise(resolve => {
                let idx = 0;
                function showNextRed() {
                    if (idx < letters.length) {
                        letters[idx].style.color = '#c88b32';
                        idx++;
                        setTimeout(showNextRed, 200);
                    } else {
                        setTimeout(showWhiteLetters, 250);
                    }
                }
                function showWhiteLetters() {
                    let jdx = 0;
                    function showNextWhite() {
                        if (jdx < letters.length) {
                            letters[jdx].style.color = '#ffffff';
                            jdx++;
                            setTimeout(showNextWhite, 150);
                        } else {
                            activateCurrentLetter();
                            resolve();
                        }
                    }
                    showNextWhite();
                }
                showNextRed();
            });
        }

        function activateCurrentLetter() {
            if (currentLetterIndex >= letters.length) return;
            const targetLetter = letters[currentLetterIndex];
            if (!targetLetter) return;
            let isWhite = true;

            activeBlinkInterval = setInterval(() => {
                targetLetter.style.color = isWhite ? '#c88b32' : '#ffffff';
                isWhite = !isWhite;
            }, 250);

            targetLetter.style.cursor = 'pointer';
            targetLetter.onclick = () => handleLetterClick(currentLetterIndex);
        }

        function handleLetterClick(index) {
            const targetLetter = letters[index];
            if (!targetLetter) return;
            targetLetter.onclick = null;
            clearInterval(activeBlinkInterval);

            let blinks = 0;
            let isWhite = false;
            const blinkFive = setInterval(() => {
                targetLetter.style.color = isWhite ? '#ffffff' : '#c88b32';
                isWhite = !isWhite;
                blinks++;
                if (blinks >= 10) {
                    clearInterval(blinkFive);
                    targetLetter.style.color = '#ffffff';
                    showModalTyped(index);
                }
            }, 100);
        }

        async function showModalTyped(index) {
            const backdrop = document.getElementById('modal-backdrop');
            const modalBox = document.getElementById('modal-content-box');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            if (!backdrop || !modalBox || !modalTitle || !modalBody) return;

            modalBox.classList.remove('crt-exit');
            modalBox.style.opacity = '1';
            modalBox.style.transform = 'scale(1,1)';
            
            modalTitle.innerHTML = "";
            modalBody.innerHTML = "";
            
            backdrop.classList.add('active');

            const data = modalData[index];
            if (!data) return;
            
            await typeWriterHTML(modalTitle, data.title, 25);

            for (let item of data.content) {
                if (item.type === 'p') {
                    let pElem = document.createElement('p');
                    modalBody.appendChild(pElem);
                    await typeWriterHTML(pElem, item.text, 12);
                } else if (item.type === 'flow') {
                    let flowElem = document.createElement('div');
                    flowElem.className = 'process-flow';
                    modalBody.appendChild(flowElem);
                    await typeWriterHTML(flowElem, item.text, 12);
                } else if (item.type === 'ul') {
                    let ulElem = document.createElement('ul');
                    modalBody.appendChild(ulElem);
                    for (let liText of item.items) {
                        let liElem = document.createElement('li');
                        ulElem.appendChild(liElem);
                        await typeWriterHTML(liElem, liText, 12);
                    }
                }
            }

            // Activar eventos para los hipervínculos internos (submodales de imágenes)
            modalBody.querySelectorAll('.modal-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const imgSrc = link.getAttribute('data-img');
                    openSubmodal(imgSrc);
                });
            });

            let closeContainer = document.createElement('div');
            closeContainer.style.textAlign = 'right';
            closeContainer.style.marginTop = '1.5rem';

            let closeBtn = document.createElement('span');
            closeBtn.className = 'close-link';
            closeBtn.id = 'modal-close-btn';
            closeBtn.textContent = 'Cerrar.';

            let cursor = document.createElement('span');
            cursor.style.display = 'inline-block';
            cursor.style.width = '8px';
            cursor.style.height = '1.1em';
            cursor.style.background = '#c88b32';
            cursor.style.marginLeft = '4px';
            cursor.style.verticalAlign = 'middle';
            cursor.style.animation = 'blinkCursor 0.8s infinite';

            closeContainer.appendChild(closeBtn);
            closeContainer.appendChild(cursor);
            modalBody.appendChild(closeContainer);

            const triggerClose = () => {
                closeBtn.onclick = null;
                backdrop.onclick = null;

                modalBox.classList.add('crt-exit');

                setTimeout(() => {
                    backdrop.classList.remove('active');

                    if (letters[index]) letters[index].style.color = '#c88b32';
                    currentLetterIndex++;
                    selectedCount++;

                    if (selectedCount < 7) {
                        activateCurrentLetter();
                    } else {
                        enableFinalHyperlink();
                    }
                }, 400);
            };

            closeBtn.onclick = triggerClose;
            backdrop.onclick = (e) => {
                if (e.target === backdrop) {
                    triggerClose();
                }
            };
        }

        function openSubmodal(imgSrc) {
            const subBackdrop = document.getElementById('submodal-backdrop');
            const subBox = subBackdrop.querySelector('.submodal-box');
            const subImg = document.getElementById('submodal-img');

            if (!subBackdrop || !subBox || !subImg) return;

            // Limpieza previa obligatoria para evitar bug de imagen anterior
            subImg.src = '';

            subBox.classList.remove('crt-exit');
            subBox.classList.add('crt-enter');
            subBackdrop.classList.add('active');

            subImg.src = imgSrc;
        }

        function closeSubmodal() {
            const subBackdrop = document.getElementById('submodal-backdrop');
            const subBox = subBackdrop.querySelector('.submodal-box');
            const subImg = document.getElementById('submodal-img');

            if (!subBackdrop || !subBox) return;

            subBox.classList.remove('crt-enter');
            subBox.classList.add('crt-exit');

            setTimeout(() => {
                subBackdrop.classList.remove('active');
                subBox.classList.remove('crt-exit');
                if (subImg) subImg.src = '';
            }, 400);
        }

        function enableFinalHyperlink() {
            const wordContainer = document.getElementById('quimera-word');
            if (!wordContainer) return;
            wordContainer.style.cursor = 'pointer';

            const stepTime = 500 / letters.length;

            function runSequence() {
                let i = 0;
                function turnCopperGold(callback) {
                    if (i < letters.length) {
                        if (letters[i]) letters[i].style.color = '#c88b32';
                        i++;
                        globalColorInterval = setTimeout(() => turnCopperGold(callback), stepTime);
                    } else if (callback) {
                        callback();
                    }
                }

                let j = 0;
                function turnWhite(callback) {
                    if (j < letters.length) {
                        if (letters[j]) letters[j].style.color = '#ffffff';
                        j++;
                        globalColorInterval = setTimeout(() => turnWhite(callback), stepTime);
                    } else if (callback) {
                        callback();
                    }
                }

                turnCopperGold(() => {
                    i = 0;
                    turnWhite(() => {
                        j = 0;
                        globalColorInterval = setTimeout(runSequence, 0);
                    });
                });
            }

            runSequence();

            wordContainer.onclick = () => {
                clearTimeout(globalColorInterval);

                document.body.classList.add('blurring');

                const overlay = document.getElementById('intro-overlay');
                if (overlay) {
                    overlay.style.background = '#ffffff';
                    overlay.style.opacity = '1';
                    overlay.classList.remove('fade-out');
                }

                setTimeout(() => {
                    window.location.href = "https://quimerac3.github.io/QuimeraC3-Q/";
                }, 1000);
            };
        }
    </script>
