<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quimera &bull; Ecosistema Científico, Académico y Profesional</title>
    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.90);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0f766e;
            --accent: #c88b32;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Arquitectura de diseño directo al viewport */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000000;
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: filter 1s ease;
        }

        body.blurring {
            filter: blur(12px);
        }

        /* Imagen de fondo independiente */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(11, 19, 41, 0.01), rgba(11, 19, 41, 0.01)), url('Quimera_Mision.png');
            background-size: cover;
            background-position: center center;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .bg-image.visible {
            opacity: 1;
        }

        /* Capa de desvanecimiento inicial en blanco */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
        }

        /* Header Superior Izquierda */
        .top-header {
            position: absolute;
            top: 2.5rem;
            left: 3rem;
            z-index: 100;
        }

        .top-header a {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.01em;
            transition: color 0.2s ease;
            opacity: 0;
        }

        .top-header a:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        /* Header Superior Derecha */
        .top-header-right {
            position: absolute;
            top: 2rem;
            right: 3rem;
            z-index: 100;
            display: flex;
            gap: 1rem;
        }

        .top-header-right a {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            opacity: 0;
            transition: opacity 0.8s ease, background-color 0.3s ease;
            background: rgba(15, 118, 110, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 20px;
        }

        .top-header-right a.visible {
            opacity: 1;
        }

        .top-header-right a:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Título Principal MISIÓN */
        .page-title {
            position: absolute;
            top: 16vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #c88b32;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.85), 0 0 25px rgba(255, 255, 255, 0.5), 0 2px 8px rgba(0, 0, 0, 1.0);
            white-space: nowrap;
            opacity: 0;
            z-index: 10;
        }

        /* Subtítulo QUIMERA */
        .quimera-word-container {
            position: absolute;
            top: 78vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            cursor: default;
            opacity: 0;
            transition: opacity 0.8s ease;
            white-space: nowrap;
            z-index: 10;
        }

        .quimera-word-container.visible {
            opacity: 1;
        }

        .quimera-letter {
            display: inline-block;
            color: #ffffff;
            transition: color 0.4s ease;
        }

        /* Subtítulo de texto */
        .subtitle-text {
            position: absolute;
            top: calc(78vh + 5.0rem + 0.5rem);
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.3rem;
            line-height: 1.5;
            max-width: 900px;
            width: 90%;
            color: #e2e8f0;
            text-align: center;
            opacity: 0;
            z-index: 10;
        }

        /* Recuadro de instrucciones interactivo */
        .exploration-box {
            position: absolute;
            top: 92.5vh;
            left: 50%;
            transform: translateX(-50%);
            max-width: 1100px;
            width: 100%;
            padding: 0.2rem 0.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #cbd5e1;
            opacity: 0;
            transition: opacity 0.8s ease;
            text-align: center;
            z-index: 10;
        }

        .exploration-box.visible {
            opacity: 1;
        }

        #exp-title {
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        /* Footer integrado de forma absoluta al fondo del viewport */
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 0.5rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: #ffffff;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 500ms ease;
            z-index: 100;
        }

        footer.visible {
            opacity: 1;
        }

        footer p {
            color: #e2e8f0;
        }

        /* ========================================================== */
        /* AJUSTE ESPECÍFICO PARA RESOLUCIÓN 1920x1080px (PROYECTOR)    */
        /* ========================================================== */
        @media (min-width: 1400px) and (max-width: 1920px) and (max-height: 1080px) {
            .page-title {
                top: 16vh;
            }
            .quimera-word-container {
                top: 78vh;
            }
            .subtitle-text {
                top: calc(78vh + 5.0rem + 0.5rem);
            }
            .exploration-box {
                top: 92.5vh;
            }
        }

        /* ========================================================== */
        /* OPTIMIZACIÓN RESPONSIVO PARA MÓVILES                        */
        /* ========================================================== */
        @media (max-width: 900px) {
            body {
                height: auto;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .bg-image {
                height: 100%;
                background-attachment: scroll;
            }

            .top-header, .top-header-right {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                right: auto !important;
                text-align: center;
                justify-content: center;
                margin: 1rem 0;
            }

            .top-header-right {
                flex-wrap: wrap;
                gap: 0.8rem;
            }

            .page-title, .quimera-word-container, .subtitle-text, .exploration-box {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 1rem auto !important;
                text-align: center;
                white-space: normal !important;
            }

            .page-title {
                font-size: 1.8rem !important;
            }

            .quimera-word-container {
                font-size: 2.5rem !important;
            }

            .subtitle-text {
                font-size: 1rem !important;
                padding: 0 1rem;
            }

            .exploration-box {
                padding: 1rem !important;
            }

            footer {
                position: relative !important;
                margin-top: 1.5rem;
                padding: 1rem;
            }
        }

        /* Recuadro Central Modal */
        #modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 750px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            text-align: left;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            transform-origin: center center;
        }

        /* Animación CRT Apagado (Salida) */
        @keyframes tvShutdown {
            0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
            40% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            70% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
        }

        /* Animación CRT Encendido (Entrada) */
        @keyframes tvTurnOn {
            0% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
            30% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            60% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            100% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
        }

        .modal-box.crt-exit {
            animation: tvShutdown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .modal-box h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.5rem;
            color: #c88b32;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .modal-box p, .modal-box li {
            font-size: 1.02rem;
            color: #f1f5f9;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .modal-box ul {
            padding-left: 1.25rem;
            margin-bottom: 1rem;
        }

        /* Estilos para los links interactivos del Modal */
        .mission-link {
            color: #c88b32;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .mission-link:hover {
            color: #5eead4;
        }

        .process-flow {
            background: rgba(15, 118, 110, 0.2);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            margin: 1rem 0;
            color: #5eead4;
        }

        .close-link {
            display: inline-block;
            color: #c88b32;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .close-link:hover {
            color: #e0a96d;
        }

        /* ========================================================== */
        /* MODAL SECUNDARIO PARA IMÁGENES                             */
        /* ========================================================== */
        #image-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85); /* Un poco más oscuro */
            backdrop-filter: blur(5px);
            z-index: 2000; /* Sobre el modal principal */
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #image-modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .image-modal-box {
            position: relative;
            background: #000;
            padding: 0; 
            border: 2px solid var(--primary);
            border-radius: 8px;
            max-width: 90vw;
            max-height: 90vh;
            box-shadow: var(--shadow-lg);
            transform-origin: center center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal-box img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 6px;
            display: block;
            object-fit: contain;
        }

        .close-image-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: var(--card-bg);
            color: #c88b32;
            border: 2px solid var(--primary);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 2010;
            transition: all 0.2s ease;
        }

        .close-image-btn:hover {
            color: #ffffff;
            background: var(--primary);
            transform: scale(1.1);
        }

        .image-modal-box.crt-enter {
            animation: tvTurnOn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .image-modal-box.crt-exit {
            animation: tvShutdown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

    <script>
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // Control de Reproducción de Música
        const music = document.getElementById('bg-music');
        const musicLink = document.getElementById('music-link');
        let isMusicPlaying = false;

        musicLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                musicLink.textContent = '🎵 Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    musicLink.textContent = '🎶 Música: ON';
                    isMusicPlaying = true;
                }).catch(error => {
                    console.log("Error al reproducir audio:", error);
                });
            }
        });

        // Control de Pantalla Completa
        const fullscreenLink = document.getElementById('fullscreen-link');

        fullscreenLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenLink.textContent = '❌ Salir Pantalla Completa';
                }).catch(err => {
                    console.log("Error al intentar entrar en pantalla completa:", err);
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenLink.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenLink.textContent = '⛶ Pantalla Completa';
            } else {
                fullscreenLink.textContent = '❌ Salir Pantalla Completa';

        });

        const modalData = [

        function typeWriter(elementId, text, speed = 35) {
            return new Promise(resolve => {
                const el = document.getElementById(elementId);
                el.innerHTML = '';
                el.style.opacity = 1; 
                let i = 0;
                function type() {
                    if (i < text.length) {
                        el.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        function typeWriterHTML(element, htmlString, speed = 20) {
            return new Promise(resolve => {
                element.innerHTML = '';
                const tokens = htmlString.match(/(<\/?[^>]+(>|$)|[^<]+)/g) || [htmlString];
                let tokenIdx = 0;
                let charIdx = 0;
                
                function type() {
                    if (tokenIdx < tokens.length) {
                        let currentToken = tokens[tokenIdx];
                        if (currentToken.startsWith('<')) {
                            element.innerHTML += currentToken;
                            tokenIdx++;
                            setTimeout(type, speed);
                        } else {
                            if (charIdx < currentToken.length) {
                                element.innerHTML += currentToken.charAt(charIdx);
                                charIdx++;
                                setTimeout(type, speed);
                            } else {
                                charIdx = 0;
                                tokenIdx++;
                                setTimeout(type, speed);
                            }

            padding: 1rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            margin: 1rem 0;
            color: #5eead4;
        }

        .close-link {
            display: inline-block;
            color: #c88b32;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .close-link:hover {
            color: #e0a96d;
        }

        /* ===== ESTILOS DEL NUEVO VISOR DE IMÁGENES ===== */
        .mission-link {
            color: #38bdf8;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .mission-link:hover {
            color: #5eead4;
        }

        #image-viewer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #image-viewer-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .image-viewer-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0, 0); 
        }

        .image-viewer-content img {
            max-width: 100%;
            max-height: 85vh;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8);
        }

        #close-image-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #c88b32;
            font-size: 2.5rem;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: color 0.2s ease;
            line-height: 1;
        }

        #close-image-btn:hover {
            color: #e0a96d;
        }
    </style>
</head>
<body>

    <!-- Elemento de Audio -->
    <audio id="bg-music" src="Quimera_Milonga_(Lado_B).mp3" loop preload="auto"></audio>

    <!-- Capa de fondo animada -->
    <div class="bg-image" id="bg-image"></div>

    <!-- Capa de desvanecimiento inicial en blanco -->
    <div id="intro-overlay"></div>

    <!-- Header Izquierdo -->
    <header class="top-header">
        <a href="[https://quimerac3.github.io/](https://quimerac3.github.io/)" id="header-link"></a>
    </header>

    <!-- Header Derecho -->
    <div class="top-header-right">
        <a href="#" id="music-link">🎵 Música: OFF</a>
        <a href="#" id="fullscreen-link">⛶ Pantalla Completa</a>
    </div>

    <h1 class="page-title" id="main-title"></h1>

    <div class="quimera-word-container" id="quimera-word">
        <span class="quimera-letter" data-index="0">Q</span><span class="quimera-letter" data-index="1">U</span><span class="quimera-letter" data-index="2">I</span><span class="quimera-letter" data-index="3">M</span><span class="quimera-letter" data-index="4">E</span><span class="quimera-letter" data-index="5">R</span><span class="quimera-letter" data-index="6">A</span>
    </div>

    <div class="subtitle-text" id="sub-text"></div>

    <div class="exploration-box" id="exp-box">
        <p id="exp-title"></p>
        <p id="exp-desc"></p>
    </div>

    <footer>
        <p data-text="&bull; &copy; 2026 Instituto Quimera. &bull; Centro de Investigación, Docencia, Servicio y Difusión. &bull; Dr.C. Cesar Cerezo Camacho. &bull; Todos los derechos reservados. &bull;"></p>
    </footer>

    <!-- Modal -->
    <div id="modal-backdrop">
        <div class="modal-box" id="modal-content-box">
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Visor de Imágenes Misión -->
    <div id="image-viewer-backdrop">
        <div class="image-viewer-content" id="image-viewer-content">
            <span id="close-image-btn">&times;</span>
            <img id="mission-image" src="" alt="Proceso de Misión">
        </div>
    </div>

    <script>
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // Control de Reproducción de Música
        const music = document.getElementById('bg-music');
        const musicLink = document.getElementById('music-link');
        let isMusicPlaying = false;

        musicLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                musicLink.textContent = '🎵 Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    musicLink.textContent = '🎶 Música: ON';
                    isMusicPlaying = true;
                }).catch(error => {
                    console.log("Error al reproducir audio:", error);
                });
            }
        });

        // Control de Pantalla Completa
        const fullscreenLink = document.getElementById('fullscreen-link');

        fullscreenLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenLink.textContent = '❌ Salir Pantalla Completa';
                }).catch(err => {
                    console.log("Error al intentar entrar en pantalla completa:", err);
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenLink.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenLink.textContent = '⛶ Pantalla Completa';
            } else {
                fullscreenLink.textContent = '❌ Salir Pantalla Completa';
            }
        });

        const modalData = [
            {
                title: "NUESTRA RAZÓN DE EXISTIR.",
                content: [
                    { type: 'p', text: "Quimera existe porque el conocimiento adquiere verdadero valor cuando puede ser comprendido, conectado, desarrollado, aplicado y transferido." },
                    { type: 'p', text: "Los problemas científicos, médicos, académicos y profesionales rara vez pertenecen a una sola disciplina. Su complejidad exige integrar conocimientos, establecer relaciones, formular mejores preguntas y desarrollar métodos que permitan transformar información en comprensión y comprensión en acción." },
                    { type: 'p', text: "Por ello, Quimera no busca únicamente acumular conocimiento: busca generarlo, integrarlo, desarrollarlo y transferirlo de manera rigurosa, crítica y responsable." }
                ]
            },
            {
                title: "NUESTRA MISIÓN.",
                content: [
                    { type: 'p', text: "Quimera busca generar, integrar y transferir conocimiento científico, académico y profesional mediante investigación, formación, metodología e innovación, desarrollando herramientas y soluciones que contribuyan a mejorar la práctica, la comunicación y el desarrollo de las ciencias de la salud y sus disciplinas relacionadas." },
                    { type: 'p', text: "Nuestra misión se materializa mediante metodologías que permiten transformar preguntas complejas en procesos de análisis, desarrollo, evaluación y transferencia. Y se fundamenta en una premisa esencial: El conocimiento no es valioso simplemente porque se posea, sino que alcanza su máximo valor cuando puede comprenderse, aplicarse y transferirse responsablemente." }
                ]
            },
            {
                title: "¿CÓMO CUMPLIMOS NUESTRA MISIÓN?",
                content: [
                    { type: 'p', text: "La misión de Quimera se desarrolla mediante cinco procesos interrelacionados:" },
                    { type: 'ul', items: [
                        "<span class='mission-link' data-img='Quimera_Investigacion.png'>-01. Investigación.</span>",
                        "<span class='mission-link' data-img='Quimera_Formacion.png'>-02. Formación.</span>",
                        "<span class='mission-link' data-img='Quimera_Desarrollo.png'>-03. Desarrollo.</span>",
                        "<span class='mission-link' data-img='Quimera_Aplicacion.png'>-04. Aplicación.</span>",
                        "<span class='mission-link' data-img='Quimera_Transferencia.png'>-05. Transferencia.</span>" ]}
                ]
            },
            {
                title: "EL CICLO DE QUIMERA.",
                content: [
                    { type: 'p', text: "Estos procesos no funcionan como etapas asiladas\nForman un ciclo dinámico, el Ciclo de Quimera:" },
                    { type: 'flow', text: "INVESTIGACIÓN → CONOCIMIENTO → FORMACIÓN → DOCENCIA → CAPACIDAD → DESARROLLO → HERRAMIENTAS → APLICACIÓN → EXPERIENCIA → TRANSFERENCIA → NUEVAS PREGUNTAS → INVESTIGACIÓN" },
                    { type: 'p', text: "Cada resultado puede convertirse en el punto de partida de una nueva investigación.\nCada problema puede generar conocimiento.\nCada conocimiento puede convertirse en una capacidad\nCada capacidad.\nCada capacidad puede producir una herramienta o solución.\nCada aplicación puede generar experiencia.\nCada experiencia puede producir nuevas preguntas.\nY cada nueva pregunta puede inciar nuevamente el proceso." },
                    { type: 'p', text: "Por ello, Quimera entiende el conocmiento como un sistema evolutivo y no como un producto terminado." }
                ]
            },
            {
                title: "NUESTRO COMPROMISO.",
                content: [
                    { type: 'p', text: "Quimera se compromete a desarrollar conocmiento con:" },
                    { type: 'ul', items: [
                        "Rigor, para fundamentar lo que afirmamos.",
                        "Pensamiento crítico, para cuestionar lo que creemos saber.",
                        "Interdisciplinariedad, para conectar aquello que tradicionalmente permanece separado.",
                        "Metodología, para convertir la intención en procesos reproducibles y evaluables.",
                        "Innovación, para desarrollar nuevas formas de comprender y resolver problemas.",
                        "Responsabilidad, para reconocer las consecuencias de aquello que investigamos.",
                        "Transferencia, para procurar que el conocimiento pueda convertirse en capacidad y beneficio más allá de su origen." }
                ]
            },
            {
                title: "NUESTRA RAZÓN ÚLTIMA.",
                content: [
                    { type: 'p', text: "Quimera existe para responder preguntas complejas sin reducirlas artificialmente a respuestas simples." },
                    { type: 'p', text: "Existimos para transformar preguntas en conocimiento, conocimiento en comprensión, comprensión en capacidad, y capacidad en práctica responsable." },
                    { type: 'p', text: "Porque comprender no es el final del proceso: es el punto desde el cual comienza la transformación." }
                ]
            },
            {
                title: "MISIÓN EN UNA SOLA FRASE.",
                content: [
                    { type: 'p', text: "Existimos para transformar conocimiento riguroso en comprensión, capacidad y práctica responsable." }
                ]
            }
        ];

        function typeWriter(elementId, text, speed = 35) {
            return new Promise(resolve => {
                const el = document.getElementById(elementId);
                el.innerHTML = '';
                el.style.opacity = 1; 
                let i = 0;
                function type() {
                    if (i < text.length) {
                        el.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        /* Modificación a typeWriterHTML para construir el HTML interno de forma segura */
        function typeWriterHTML(element, htmlString, speed = 20) {
            return new Promise(resolve => {
                let currentHTML = '';
                const tokens = htmlString.match(/(<\/?[^>]+(>|$)|[^<]+)/g) || [htmlString];
                let tokenIdx = 0;
                let charIdx = 0;
                
                function type() {
                    if (tokenIdx < tokens.length) {
                        let currentToken = tokens[tokenIdx];
                        if (currentToken.startsWith('<')) {
                            currentHTML += currentToken;
                            element.innerHTML = currentHTML;
                            tokenIdx++;
                            setTimeout(type, speed);
                        } else {
                            if (charIdx < currentToken.length) {
                                currentHTML += currentToken.charAt(charIdx);
                                element.innerHTML = currentHTML;
                                charIdx++;
                                setTimeout(type, speed);
                            } else {
                                charIdx = 0;
                                tokenIdx++;
                                setTimeout(type, speed);
                            }
                        }
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        async function runIntroSequence() {
            const whiteOverlay = document.getElementById('intro-overlay');
            whiteOverlay.classList.add('fade-out');
            await new Promise(r => setTimeout(r, 1000));

            document.getElementById('bg-image').classList.add('visible');
            await new Promise(r => setTimeout(r, 1000));

            await typeWriter('header-link', 'QUIMERA - Inicio General', 40);
            await new Promise(r => setTimeout(r, 400));

            document.getElementById('music-link').classList.add('visible');
            await new Promise(r => setTimeout(r, 400));

            document.getElementById('fullscreen-link').classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await typeWriter('main-title', 'MISIÓN', 80);
            await new Promise(r => setTimeout(r, 400));

            document.getElementById('quimera-word').classList.add('visible');
            await new Promise(r => setTimeout(r, 800));
            await playQuimeraAppearanceAsync();
            await new Promise(r => setTimeout(r, 400));

            await typeWriter('sub-text', 'Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.', 35);
            await new Promise(r => setTimeout(r, 400));

            document.getElementById('exp-box').classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await typeWriter('exp-title', 'EXPLORACIÓN INTERACTIVA: Una vez que la palabra QUIMERA cambie de color a blanco, seleccione la letra parpadeante para descubrir: ¿Qué es QUIMERA?', 25);
            await new Promise(r => setTimeout(r, 400));

            document.querySelector('footer').classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await new Promise(resolveFooter => {
                const footerPs = document.querySelectorAll('footer p');
                let pIndex = 0;
                function typeFooterP() {
                    if (pIndex >= footerPs.length) {
                        resolveFooter();
                        return;
                    }
                    let p = footerPs[pIndex];
                    let text = p.dataset.text.replace('2026', new Date().getFullYear());
                    let i = 0;
                    function typeChar() {
                        if (i <= text.length) {
                            p.innerHTML = text.substring(0, i);
                            i++;
                            setTimeout(typeChar, 18);
                        } else {
                            pIndex++;
                            setTimeout(typeFooterP, 100);
                        }
                    }
                    typeChar();
                }
                typeFooterP();
            });
        }

        // Controladores del nuevo visor de imágenes
        function openImageViewer(imageSrc) {
            const backdrop = document.getElementById('image-viewer-backdrop');
            const viewerContent = document.getElementById('image-viewer-content');
            const img = document.getElementById('mission-image');
            
            // Asignar la fuente de la nueva imagen
            img.src = imageSrc;
            
            // Reiniciar animaciones de encendido (CRT Inverso)
            viewerContent.classList.remove('crt-exit');
            void viewerContent.offsetWidth; // Reflow para reiniciar la animación
            viewerContent.classList.add('crt-enter');
            
            backdrop.classList.add('active');
        }

        function closeImageViewer() {
            const backdrop = document.getElementById('image-viewer-backdrop');
            const viewerContent = document.getElementById('image-viewer-content');
            const img = document.getElementById('mission-image');
            
            viewerContent.classList.remove('crt-enter');
            viewerContent.classList.add('crt-exit');
            
            setTimeout(() => {
                backdrop.classList.remove('active');
                // IMPORTANTE: Limpiar el src previene el bug de la imagen anterior
                img.src = ''; 
            }, 400); // 400ms empata con el tiempo de la animación tvShutdown
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runIntroSequence, 400);

            document.getElementById('header-link').addEventListener('click', (e) => {
                e.preventDefault();
                const overlay = document.getElementById('intro-overlay');
                overlay.style.background = '#ffffff';
                overlay.style.opacity = '1';
                overlay.classList.remove('fade-out');
                setTimeout(() => {
                    window.location.href = "[https://quimerac3.github.io/](https://quimerac3.github.io/)";
                }, 500);
            });

            // Configurar el cierre del visor de imágenes
            const imageBackdrop = document.getElementById('image-viewer-backdrop');
            const closeImgBtn = document.getElementById('close-image-btn');
            
            closeImgBtn.addEventListener('click', closeImageViewer);
            imageBackdrop.addEventListener('click', (e) => {
                // Solo cerrar si el clic es fuera del área de la imagen
                if (e.target === imageBackdrop) {
                    closeImageViewer();
                }
            });
        });

        const letters = document.querySelectorAll('.quimera-letter');
        let currentLetterIndex = 0;
        let selectedCount = 0;
        let activeBlinkInterval = null;
        let globalColorInterval = null;

        function playQuimeraAppearanceAsync() {
            return new Promise(resolve => {
                let idx = 0;
                function showNextRed() {
                    if (idx < letters.length) {
                        letters[idx].style.color = '#c88b32';
                        idx++;
                        setTimeout(showNextRed, 200);
                    } else {
                        setTimeout(showWhiteLetters, 250);
                    }
                }
                function showWhiteLetters() {
                    let jdx = 0;
                    function showNextWhite() {
                        if (jdx < letters.length) {
                            letters[jdx].style.color = '#ffffff';
                            jdx++;
                            setTimeout(showNextWhite, 150);
                        } else {
                            activateCurrentLetter();
                            resolve();
                        }
                    }
                    showNextWhite();
                }
                showNextRed();
            });
        }

        function activateCurrentLetter() {
            if (currentLetterIndex >= letters.length) return;
            const targetLetter = letters[currentLetterIndex];
            let isWhite = true;

            activeBlinkInterval = setInterval(() => {
                targetLetter.style.color = isWhite ? '#c88b32' : '#ffffff';
                isWhite = !isWhite;
            }, 250);

            targetLetter.style.cursor = 'pointer';
            targetLetter.onclick = () => handleLetterClick(currentLetterIndex);
        }

        function handleLetterClick(index) {
            const targetLetter = letters[index];
            targetLetter.onclick = null;
            clearInterval(activeBlinkInterval);

            let blinks = 0;
            let isWhite = false;
            const blinkFive = setInterval(() => {
                targetLetter.style.color = isWhite ? '#ffffff' : '#c88b32';
                isWhite = !isWhite;
                blinks++;
                if (blinks >= 10) {
                    clearInterval(blinkFive);
                    targetLetter.style.color = '#ffffff';
                    showModalTyped(index);
                }
            }, 100);
        }

        async function showModalTyped(index) {
            const backdrop = document.getElementById('modal-backdrop');
            const modalBox = document.getElementById('modal-content-box');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalBox.classList.remove('crt-exit');
            modalBox.style.opacity = '1';
            modalBox.style.transform = 'scale(1,1)';
            
            modalTitle.innerHTML = "";
            modalBody.innerHTML = "";
            
            backdrop.classList.add('active');

            const data = modalData[index];
            
            await typeWriterHTML(modalTitle, data.title, 25);

            for (let item of data.content) {
                if (item.type === 'p') {
                    let pElem = document.createElement('p');
                    modalBody.appendChild(pElem);
                    await typeWriterHTML(pElem, item.text, 12);
                } else if (item.type === 'flow') {
                    let flowElem = document.createElement('div');
                    flowElem.className = 'process-flow';
                    modalBody.appendChild(flowElem);
                    await typeWriterHTML(flowElem, item.text, 12);
                } else if (item.type === 'ul') {
                    let ulElem = document.createElement('ul');
                    modalBody.appendChild(ulElem);
                    for (let liText of item.items) {
                        let liElem = document.createElement('li');
                        ulElem.appendChild(liElem);
                        await typeWriterHTML(liElem, liText, 12);
                    }
                }
            }

            // Activar eventos en los hipervínculos dinámicos de las imágenes
            const missionLinks = modalBody.querySelectorAll('.mission-link');
            missionLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    const imgSrc = e.target.getAttribute('data-img');
                    openImageViewer(imgSrc);
                });
            });

            let closeContainer = document.createElement('div');
            closeContainer.style.textAlign = 'right';
            closeContainer.style.marginTop = '1.5rem';

            let closeBtn = document.createElement('span');
            closeBtn.className = 'close-link';
            closeBtn.id = 'modal-close-btn';
            closeBtn.textContent = 'Cerrar.';

            let cursor = document.createElement('span');
            cursor.style.display = 'inline-block';
            cursor.style.width = '8px';
            cursor.style.height = '1.1em';
            cursor.style.background = '#c88b32';
            cursor.style.marginLeft = '4px';
            cursor.style.verticalAlign = 'middle';
            cursor.style.animation = 'blinkCursor 0.8s infinite';

            closeContainer.appendChild(closeBtn);
            closeContainer.appendChild(cursor);
            modalBody.appendChild(closeContainer);

            const triggerClose = () => {
                closeBtn.onclick = null;
                backdrop.onclick = null;

                modalBox.classList.add('crt-exit');

                setTimeout(() => {
                    backdrop.classList.remove('active');

                    letters[index].style.color = '#c88b32';
                    currentLetterIndex++;
                    selectedCount++;

                    if (selectedCount < 7) {
                        activateCurrentLetter();
                    } else {
                        enableFinalHyperlink();
                    }
                }, 400);
            };

            closeBtn.onclick = triggerClose;
            backdrop.onclick = (e) => {
                if (e.target === backdrop) {
                    triggerClose();
                }
            };
        }

        function enableFinalHyperlink() {
            const wordContainer = document.getElementById('quimera-word');
            wordContainer.style.cursor = 'pointer';

            const stepTime = 500 / letters.length;

            function runSequence() {
                let i = 0;
                function turnCopperGold(callback) {
                    if (i < letters.length) {
                        letters[i].style.color = '#c88b32';
                        i++;
                        globalColorInterval = setTimeout(() => turnCopperGold(callback), stepTime);
                    } else if (callback) {
                        callback();
                    }
                }

                let j = 0;
                function turnWhite(callback) {
                    if (j < letters.length) {
                        letters[j].style.color = '#ffffff';
                        j++;
                        globalColorInterval = setTimeout(() => turnWhite(callback), stepTime);
                    } else if (callback) {
                        callback();
                    }
                }

                turnCopperGold(() => {
                    i = 0;
                    turnWhite(() => {
                        j = 0;
                        globalColorInterval = setTimeout(runSequence, 0);
                    });
                });
            }

            runSequence();

            wordContainer.onclick = () => {
                clearTimeout(globalColorInterval);

                document.body.classList.add('blurring');

                const overlay = document.getElementById('intro-overlay');
                overlay.style.background = '#ffffff';
                overlay.style.opacity = '1';
                overlay.classList.remove('fade-out');

                setTimeout(() => {
                    window.location.href = "https://quimerac3.github.io/QuimeraC3-Q/";
                }, 1000);
            };
        }
    </script>
